  continueWhenBlocked: true
  blockingRule: "Audit matrix, isolated real E2E setup, fixture cleanup safety, and OpenSpec validation remain mandatory. Real cpa seeding or module writes may be degraded, skipped-safe, or handoff-blocked when the copied environment lacks credentials, model access, disposable resources, or deterministic cleanup."
