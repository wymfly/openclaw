  - scenarioId: deck-go-gateway-transport.single-connection
    ownerTask: "5.2,5.3,5.4"
    status: verified
    verificationCommand: cd deck-go/backend && go test -race -run 'TestRealtime_SingleConnectionAcrossRPCs|TestEnsureConnected_ConcurrentSingleflight' ./internal/gateway/...
    evidence:
      - Race test passed for single connection reuse and concurrent first-RPC singleflight.
  - scenarioId: deck-go-gateway-transport.probe-health-reuse
    ownerTask: "5.5"
    status: verified
    verificationCommand: cd deck-go/backend && go test -run TestProbeConnection_ReusesGatewayClientConnection ./internal/runtime/transport
    evidence:
      - ProbeConnection now calls gateway.ProbeHealth through a cached gateway.Client instead of opening a RequestDirect websocket per health check.
      - The cache key stores URL plus a SHA-256 token hash, not the plaintext token.
      - The test starts a real websocket Gateway and verifies two consecutive health probes observe exactly one websocket connection.
  - scenarioId: deck-go-gateway-transport.lifecycle-cancel-close
    ownerTask: "5.6,5.8,5.9,5.10,5.11"
    status: verified
    verificationCommand: cd deck-go/backend && go test -race -run 'TestCompleteConnect_CtxCancelDuringRead|TestRealtimeClose_NoGoroutineLeak|TestRealtime_PendingReceivesErrConnectionLost' ./internal/gateway/...
    evidence:
      - Race test passed for handshake cancellation, pending cleanup, Close, and ErrConnectionLost propagation.
  - scenarioId: deck-go-gateway-transport.provider-refresh
    ownerTask: "5.7,5.11"
    status: verified
    verificationCommand: cd deck-go/backend && go test -race -run 'TestRealtime_ProviderTokenRotation|TestRealtime_ProviderURLChange|TestRealtime_RetriesReconnectWhenSubscriptionRestoreFails|TestRealtime_BlocksConcurrentRequestsUntilSubscriptionRestoreCompletes' ./internal/gateway/...
    evidence:
      - Reconnect tests prove provider token and URL are reread after disconnect.
      - Subscription restore failure closes the failed socket, returns an error, retries reconnect, restores the session subscription, and delivers a session.message event on the next healthy connection.
      - Concurrent requests wait behind in-flight subscription restoration and do not issue RPCs on a socket whose restore later fails.
  - scenarioId: deck-go-gateway-transport.wrapper-smoke
    ownerTask: "5.12"
    status: verified
    verificationCommand: cd deck-go/backend && go test -run TestGatewayQueriesRepresentativeWrappersSmoke ./internal/runtime/openclaw
    evidence:
      - Representative GatewayQueries wrappers run through a real gorilla/websocket mock Gateway, gateway.Realtime, and gateway.Client.
      - AgentsList, UsageCost, SessionsListRaw, Health, and ConfigGet dispatch unchanged method names and params.
      - The smoke test verifies all five wrapper calls share exactly one websocket connection.
