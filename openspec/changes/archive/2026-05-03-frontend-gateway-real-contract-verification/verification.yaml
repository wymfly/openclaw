    ownerTask: "1.2-1.4"
    status: passed
    verificationCommand: "Smoke-test deck-go/frontend-handoff/modules/gateway/prototype.html and inspect frontend-gateway-hifi-redesign evidence"
    evidence: "Prototype smoke passed: HTTP 200, v2 gateway prototype title, H1 Gateway control plane, 57 describe method rows, no browser errors. Archived/current hifi spec inspected; refreshed v2 files include app.jsx, describe-explorer.jsx, batch-console.jsx, data.js, styles.css, tokens.css, tweaks-panel.jsx."
  - scenarioId: audit.gateway-bff-capability
    ownerTask: "2.1-2.6"
    status: passed
    verificationCommand: "Inspect DTOs, endpoint classification, Go BFF/runtime/gateway/activity/monitor routes, frontend wrappers, and production Gateway code"
    evidence: "Inspected deck-api.contract.ts DTOs, deck-endpoints.contract.json, deck-ui.contract.json, frontend api.ts/api-types.ts wrappers, GatewayPanel, Go gateway/activity/monitor routes, runtime openclaw GatewayQueries, gateway_not_configured middleware, projection aggregation, and focused tests."
  - scenarioId: contract.gateway-chain-matrix
    ownerTask: "2.5,3.1-3.5"
    status: passed
    verificationCommand: "Record workflow -> wrapper -> endpoint/DTO -> Go route/runtime/Gateway/projection -> capability classification matrix"
    evidence: "Recorded matrix in deck-go/frontend-handoff/modules/gateway/implementation-notes.md. Supported: runtime, capabilities, health, status, describe, activity, monitor list/stats/detail, refresh, first-run empty. Empty-valid: activity/monitor projections. Handoff-blocked: batch console. Partial/deferred: full describe explorer."
  - scenarioId: implementation.gateway-v2-and-scoped-fixes
    ownerTask: "3.2-3.4"
    status: passed
    verificationCommand: "Implement deterministic v2/real-contract fixes and verify unsupported prototype workflows remain inactive"
    evidence: "Fixed deterministic drift by loading fetchGatewayDescribe() in GatewayPanel, adding describe evidence tile, preserving health/status when describe degrades, updating i18n/tests/mock visual expectations, and adding L2 gateway-real-gateway.spec.ts. No source contracts changed; no generated artifacts regenerated."
  - scenarioId: frontend.gateway-focused-tests
    ownerTask: "4.1"
    status: passed
    verificationCommand: "Run focused frontend tests for deck-go/frontend-new Gateway"
    evidence: "cd deck-go/frontend-new && npm run test:deck-ui -- src/components/panels/gateway/GatewayPanel.test.tsx passed 12 tests. Broader cd deck-go/frontend-new && npm run test:deck-ui -- src/api.chat-helpers.test.ts src/components/panels/gateway/GatewayPanel.test.tsx passed 57 tests."
  - scenarioId: backend.gateway-focused-tests
    ownerTask: "4.2"
    status: passed
    verificationCommand: "Run focused Go tests for gateway routes, runtime facade, and activity/monitor projections"
    evidence: "cd deck-go/backend && go test ./internal/server ./internal/runtime/openclaw ./internal/runtime/projection -run 'Test(ActivityAndMonitorRoutes|RuntimeGatewayRoutes_ExposeReadOnlyStatus|RuntimeGatewayStatusAPI_StateMatrix|RuntimeGatewayStatusRoute_UsesFacadeShape|RuntimeGatewayStatusRoute_RemoteConfiguredUsesFacadeShape|RuntimeGatewayStatusRoute_RemoteFirstRunReturns503|RuntimeGatewayActionRoutesAreRemoved|GatewayQueries|CollectActivityEntriesAndRuns)' passed."
  - scenarioId: visual.gateway-mock-e2e
    ownerTask: "4.3"
    status: passed
    verificationCommand: "Run Gateway mock/local visual Playwright E2E and label evidence as L1 mock/local visual coverage"
    evidence: "cd deck-go && pnpm exec playwright test test/e2e/gateway-visual.spec.ts --config playwright.config.ts passed 1 test. Evidence is L1 mock/local visual coverage with contract-shaped mock activity/monitor projections and describe evidence."
  - scenarioId: l2.gateway-real-api-ui
    ownerTask: "4.4-4.5"
    status: passed
    maxAttempts: 3
    verificationCommand: "Real stack API/UI smoke for runtime readiness, gateway health/status/describe shape, activity/monitor shape, production render, and empty-valid or selected-run detail when available"
    evidence: "Attempt 1 passed after scoped test hardening. cd deck-go && DECK_GO_REAL_GATEWAY_E2E=1 pnpm exec playwright test test/e2e/gateway-real-gateway.spec.ts --config playwright.config.ts passed 2 tests. API verifies runtime/capabilities/health/status/describe/activity/monitor shapes and selected detail when a run exists, otherwise empty-valid. UI verifies Gateway panel render and no direct browser HTTP/WebSocket calls to real Gateway."
  - scenarioId: review.code-level
    ownerTask: "5.1-5.2"
    status: passed
    verificationCommand: "Manual code review of Gateway panel, API facade, Go routes/runtime/projections, contracts, mocks, and verification evidence"
    evidence: "Reviewed GatewayPanel describe degradation, API facade use, Go route/runtime/projection chain, mock and real E2E. Added WebSocket direct-Gateway guard during review. Residual risks recorded in implementation-notes.md."
  - scenarioId: final.openspec-and-build
    ownerTask: "4.6-4.9,5.4"
    status: passed
    verificationCommand: "openspec validate frontend-gateway-real-contract-verification --strict; relevant contract checks; make frontend-build; git diff --check"
    evidence: "openspec validate frontend-gateway-real-contract-verification --strict passed. No source contract/generated changes, so no contract sync/check was required. cd deck-go && make frontend-build passed. git diff --check passed."
