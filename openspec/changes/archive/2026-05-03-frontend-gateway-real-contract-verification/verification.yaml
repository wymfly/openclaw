change: frontend-gateway-real-contract-verification
archiveReady: true
circuitBreaker:
  maxFreshAttemptsPerScenario: 3
  continueWhenBlocked: true
  blockingRule: "Static contract/code review, focused tests, and L1 mock visual evidence remain mandatory. L2 real Gateway monitor detail may be empty-valid or handoff-blocked when the real stack has no monitor runs after bounded attempts."
entries:
