change: frontend-cron-real-contract-verification
archiveReady: true
circuitBreaker:
  maxFreshAttemptsPerScenario: 3
  continueWhenBlocked: true
  blockingRule: "Static contract/code review, focused tests, and L1 mock visual evidence remain mandatory. L2 real Gateway cron reads/mutations may be degraded, empty-valid, skipped-safe, or handoff-blocked when bounded attempts show missing methods, empty scheduler state, unsafe mutation state, or environment-specific Gateway behavior."
entries:
  - scenarioId: baseline.cron-handoff
    ownerTask: "1.2-1.4"
    status: passed
    verificationCommand: "Smoke-test deck-go/frontend-handoff/modules/cron/prototype.html and inspect frontend-cron-hifi-redesign evidence"
    evidence: "prototype.html loaded with title 'Scheduled jobs', New Job dialog opened, and no browser console/page errors; hifi spec and handoff package inspected."
  - scenarioId: audit.cron-gateway-bff-capability
    ownerTask: "2.1-2.6"
    status: passed
    verificationCommand: "Inspect DTOs, endpoint classification, Go BFF cron routes, Gateway method mapping, frontend wrappers, and production Cron code"
    evidence: "Verified DeckGoCron DTOs, frontend wrappers, endpoint classification, Go /api/cron route mapping, Gateway cron.* allowlist/generated methods, mock-gateway cron fixtures, and production Cron panel behavior."
  - scenarioId: contract.cron-chain-matrix
    ownerTask: "2.5,3.1-3.6"
    status: passed
    verificationCommand: "Record workflow -> wrapper -> endpoint/DTO -> Go route/Gateway method -> capability classification matrix"
    evidence: "Matrix recorded in deck-go/frontend-handoff/modules/cron/implementation-notes.md for status, inventory, filters, create/update/toggle/run/delete, history, scheduler detail, raw evidence, unsupported preview/bulk/live-history/concurrency gaps, and BFF-only access."
  - scenarioId: implementation.cron-v2-and-scoped-fixes
    ownerTask: "3.2-3.5"
    status: passed
    verificationCommand: "Implement deterministic UI/docs/test/BFF fixes and verify unsupported prototype workflows remain inactive, degraded, or documented"
    evidence: "Production Cron panel refactored to v2 workbench with topbar KPIs, filtered/sorted job table, selected detail tabs, builder modal, in-app delete confirmation, action evidence, and unsupported preview/bulk/live-history gaps documented."
  - scenarioId: frontend.cron-focused-tests
    ownerTask: "4.1"
    status: passed
    verificationCommand: "Run focused frontend tests for deck-go/frontend-new Cron"
    evidence: "cd deck-go/frontend-new && npm run test:deck-ui -- src/components/panels/cron/CronPanel.test.tsx src/api.chat-helpers.test.ts -> 52 tests passed."
  - scenarioId: backend.cron-focused-tests
    ownerTask: "4.2"
    status: passed
    verificationCommand: "Run focused Go tests for cron BFF/Gateway route forwarding"
    evidence: "cd deck-go/backend && go test ./internal/server ./internal/runtime/openclaw ./internal/api/http -run 'TestGatewayFacade_CronRoutes|TestGatewayQueriesTyped|TestMountRuntimeRoutes|TestNewHandlerWithDependencies_ExposesStage2RuntimeRoutes|TestManagedRuntime|TestLegacyInventorySurface|TestAdapterCron' -> passed."
  - scenarioId: visual.cron-mock-e2e
    ownerTask: "4.3"
    status: passed
    verificationCommand: "Run Cron mock/local visual Playwright E2E and label evidence as L1 mock/local visual coverage"
    evidence: "cd deck-go && pnpm exec playwright test test/e2e/cron-visual.spec.ts --config playwright.config.ts -> 1 passed. L1 mock/local visual coverage only."
  - scenarioId: l2.cron-real-api-ui
    ownerTask: "4.4-4.5"
    status: passed
    maxAttempts: 3
    verificationCommand: "Real stack API/UI smoke for status, inventory, safe run-history path when a job exists, empty/degraded handling, and no direct browser Gateway calls"
    evidence: "cd deck-go && DECK_GO_REAL_GATEWAY_E2E=1 pnpm exec playwright test test/e2e/cron-real-gateway.spec.ts --config playwright.config.ts -> 2 passed. L2 bounded route-chain/UI/BFF-boundary evidence; real mutations remain skipped-safe."
  - scenarioId: review.code-level
    ownerTask: "5.1-5.2"
    status: passed
    verificationCommand: "Manual code review of Cron panel, API facade, Go routes/runtime, contracts, mocks, and verification evidence"
    evidence: "Reviewed Cron panel, API facade, Go route/runtime forwarding, contracts, mock Gateway fixtures, handoff docs, L1/L2 tests, and evidence matrix; deterministic route/UI/test drift fixed directly."
  - scenarioId: final.openspec-and-build
    ownerTask: "4.6-4.9,5.4"
    status: passed
    verificationCommand: "openspec validate frontend-cron-real-contract-verification --strict; relevant contract checks; make frontend-build; git diff --check"
    evidence: "openspec validate passed; cd deck-go && make endpoint-classification-check passed; cd deck-go && make frontend-build passed; git diff --check passed."
