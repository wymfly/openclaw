    evidence: "Implemented canonical POST /api/memory/search in active/admin BFF route trees with GET compatibility alias, switched searchMemory wrapper/tests to POST, refactored MemoryPanel to Browse/Search/Health/Dreams v2, kept unsupported search degraded, and updated handoff docs."
