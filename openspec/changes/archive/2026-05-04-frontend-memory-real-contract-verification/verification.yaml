change: frontend-memory-real-contract-verification
archiveReady: true
circuitBreaker:
  maxFreshAttemptsPerScenario: 3
  continueWhenBlocked: true
  blockingRule: "Static contract/code review, focused tests, and L1 mock visual evidence remain mandatory. L2 real Gateway memory files, LanceDB search, dream diary presence, or destructive maintenance actions may be empty-valid, degraded, skipped-safe, or handoff-blocked when the real stack has no data or the action would mutate user memory after bounded attempts."
