    evidence: "L2 real Gateway E2E passed on first fresh attempt: cd deck-go && DECK_GO_REAL_GATEWAY_E2E=1 pnpm exec playwright test test/e2e/memory-real-gateway.spec.ts --config playwright.config.ts. Verified API route shapes, production Memory UI render, and BFF-only browser access."
