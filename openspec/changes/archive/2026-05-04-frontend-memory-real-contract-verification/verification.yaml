    status: passed
    verificationCommand: "Smoke-test deck-go/frontend-handoff/modules/memory/prototype.html and inspect frontend-memory-hifi-redesign evidence"
    evidence: "Inspected v2 multi-file handoff package and current Memory production code; prototype.html loaded via local static server and four tabs switched without browser errors."
  - scenarioId: audit.memory-bff-capability
    ownerTask: "2.1-2.6"
    status: passed
    verificationCommand: "Inspect DTOs, endpoint classification, Go BFF/runtime routes, Gateway method mapping, frontend wrappers, and production Memory code"
    evidence: "Audited deck-api DTOs, endpoint classification, active/admin BFF routes, runtime adapters, Gateway doctor.memory methods, frontend wrappers, and MemoryPanel behavior. Found POST search missing and Gateway per-agent dreams unsupported."
  - scenarioId: contract.memory-chain-matrix
    ownerTask: "2.5,3.1-3.6"
    status: passed
    verificationCommand: "Record workflow -> wrapper -> endpoint/DTO -> Go route/runtime/Gateway -> capability classification matrix"
    evidence: "Recorded matrix in deck-go/frontend-handoff/modules/memory/implementation-notes.md. Browse/read supported when workspace resolves; search degraded 501 until LanceDB adapter exists; health supported with single-agent fallback; dreams safe read supported with per-agent Gateway gap."
