    evidence: "Recorded matrix in deck-go/frontend-handoff/modules/models/implementation-notes.md; classified config read/save, schema lookup, runtime inventory, auth overview, catalog, usage, provider/config/fallback/allowlist/Bedrock edits, usage aliases, projected pricing/audit, force-probe cache, and BFF-only browser behavior."
