    evidence: "cd deck-go/frontend-new && npm run test:deck-ui -- src/api.chat-helpers.test.ts src/components/panels/models/ModelsPanel.test.tsx passed: 2 files, 66 tests."
  - scenarioId: backend.models-focused-tests
    ownerTask: "4.2"
