    evidence: "cd deck-go && pnpm exec playwright test test/e2e/models-visual.spec.ts --config playwright.config.ts passed. Evidence is L1 mock/local visual coverage for ready workbench and provider config/fallback/usage/runtime inventory states."
  - scenarioId: l2.models-real-api-ui
    ownerTask: "4.4-4.5"
    status: passed
    maxAttempts: 3
    verificationCommand: "Real stack API/UI smoke for Models config, runtime inventory, auth overview, catalog providers, usage, safe probe/mutation when available, empty/degraded handling, and no direct browser Gateway calls"
    evidence: "First DECK_GO_REAL_GATEWAY_E2E=1 run started the real stack and passed the UI BFF-boundary test, but route/RPC test failed because models.configured returned 502; test was tightened to record runtime RPC 400/404/501/502/503 as degraded while keeping config/usage/UI strict. Rerun `cd deck-go && DECK_GO_REAL_GATEWAY_E2E=1 pnpm exec playwright test test/e2e/models-real-gateway.spec.ts --config playwright.config.ts` passed: 2 tests. Probe remained skipped-safe to avoid real provider calls."
