    evidence: "cd deck-go/backend && GOCACHE=/tmp/deck-go-buildcache go test ./internal/server ./internal/api/http ./internal/runtime/openclaw -run 'TestGatewayFacade_ModelsConfigRoute|TestGatewayFacade_UsageCostProviderRoutes|TestMountAdminRoutes|TestGatewayQueriesLowRiskWrappersUseTypedClient|TestGatewayQueriesRepresentativeWrappersSmoke' passed."
