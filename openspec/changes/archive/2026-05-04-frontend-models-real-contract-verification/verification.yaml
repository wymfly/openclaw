    status: passed
    verificationCommand: "Inspect DTOs, endpoint classification, UI metadata, Go BFF Models/usage/config routes, generated Gateway method mapping, frontend wrappers, and mock fixtures"
    evidence: "Inspected DeckGoModelsConfigResponse, DeckGoConfigApplyResponse, DeckGoRuntimeConfiguredModel(s), DeckGoModelAuthProvider/Overview, DeckGoCatalogProvider/CatalogProviders, DeckGoModelProbeResponse, DeckGoUsageCostResponse, DeckGoUsageProvidersResponse, ConfigLookupResponse, endpoint classification, UI metadata, Go admin/server/runtime routes, generated Gateway methods, frontend wrappers, mock gateway model/auth/catalog/probe handlers, and existing Models tests."
