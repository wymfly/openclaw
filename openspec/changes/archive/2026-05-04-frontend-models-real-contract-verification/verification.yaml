change: frontend-models-real-contract-verification
archiveReady: true
circuitBreaker:
  maxFreshAttemptsPerScenario: 3
  continueWhenBlocked: true
  blockingRule: "Static contract/code review, focused tests, and L1 mock visual evidence remain mandatory. L2 real Gateway Models reads may be degraded or empty-valid; real config mutation or probe flows may be skipped-safe when provider auth, usage data, config hash, or operator-state safety blocks fresh evidence."
