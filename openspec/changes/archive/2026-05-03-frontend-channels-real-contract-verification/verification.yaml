change: frontend-channels-real-contract-verification
archiveReady: true
circuitBreaker:
  maxFreshAttemptsPerScenario: 3
  continueWhenBlocked: true
  blockingRule: "Static contract/code review, focused tests, and L1 mock visual evidence remain mandatory. L2 real Gateway scenarios may be handoff-blocked after bounded attempts with evidence."
entries:
  - scenarioId: baseline.channels-v2-handoff
    ownerTask: "1.2-1.4"
    status: verified
    verificationCommand: "Serve or open deck-go/frontend-handoff/modules/channels/prototype.html and inspect browser console"
    evidence: "2026-05-04: local prototype smoke loaded title `deck-go channels — interactive prototype`, rendered Channels inventory and actions, with no browser console errors, page errors, or 4xx/5xx responses. Baseline notes recorded in deck-go/frontend-handoff/modules/channels/implementation-notes.md."
  - scenarioId: audit.gateway-bff-capability
    ownerTask: "2.1-2.7"
    status: verified
    verificationCommand: "Inspect generated Gateway artifacts, contracts/source files, Go BFF routes/adapters, gateway.describe, and exception registry"
    evidence: "2026-05-04: inspected generated Gateway TS/Go artifacts, Gateway channels source/schema, Deck endpoint and exception contracts, Go BFF routes/adapters, frontend API wrappers, and current focused tests. Real stack evidence: /api/gateway/describe returned 82 methods but omitted channels.status/logout; /api/channels returned a valid empty channels shape; direct typed RPC channels.status succeeded through /api/v1/runtimes/rt_local/gateway/rpc; direct channels.logout for telegram returned INVALID_REQUEST because no configured disposable channel was available; throughput returned zero totals and zero buckets. Capability matrix and describe drift are recorded in deck-go/frontend-handoff/modules/channels/implementation-notes.md."
  - scenarioId: contract.channels-chain-matrix
    ownerTask: "3.1-3.7"
    status: verified
    verificationCommand: "Record workflow -> API wrapper -> Deck endpoint/DTO -> Go adapter/selector -> Gateway method/BFF projection matrix"
    evidence: "2026-05-04: compared channels v2 mock assumptions with DeckGoChannelsStatusResponse, DeckGoChannelTestResponse, DeckGoChannelThroughputResponse, frontend-new/src/api.ts wrappers, endpoint classification, and Go BFF adapter behavior. Decision: no Deck-facing DTO source change in this pass; accountDiagnostics stays a frontend selector, dmPolicy stays selector/provider-shaped patch behavior, wecomAccess stays config/routing-backed, throughput remains an honest empty BFF placeholder. Unsupported prototype expectations are recorded in implementation notes. No generated artifact regeneration required."
  - scenarioId: backend.channels-adapter-tests
    ownerTask: "4.1-4.5,9.3"
    status: verified
    verificationCommand: "Run focused Go tests for touched channels backend adapters/routes"
    evidence: "2026-05-04: no backend code changes were required by channels calibration. Existing focused checks passed: cd deck-go/backend && go test ./internal/server -run 'TestGatewayFacade_Channel(TestThroughputAndProjection|PatchUsesConfigGetThenConfigPatch)' and cd deck-go/backend && go test ./internal/runtime/openclaw -run 'TestGatewayQueriesRepresentativeWrappersSmoke|TestGatewayQueriesLowRiskWrappersUseTypedClient'. Backend gaps recorded: gateway.describe omits channels.*, throughput is an explicit empty placeholder, and real mutations require disposable state."
  - scenarioId: frontend.channels-focused-tests
    ownerTask: "6.1-6.3,9.2"
    status: verified
    verificationCommand: "Run focused frontend tests for deck-go/frontend-new channels"
    evidence: "2026-05-04: cd deck-go/frontend-new && npm run test:deck-ui -- src/api.chat-helpers.test.ts src/components/panels/channels/ChannelsPanel.test.tsx passed. Result: 2 test files passed, 53 tests passed. Coverage includes channels API wrappers for inventory, throughput, logout, channel patch, config read/patch, routing helper filters, and probe 502 error preservation, plus production channels component tests for v2 list/detail, localization, navigation, probe, settings, routing, WeCom, and real empty payload states."
  - scenarioId: visual.channels-mock-e2e
    ownerTask: "6.4-6.5,9.4"
    status: verified
    verificationCommand: "Run channels mock visual Playwright E2E and label evidence as L1 mock visual coverage"
    evidence: "2026-05-04: cd deck-go && pnpm exec playwright test test/e2e/channels-visual.spec.ts --config playwright.config.ts passed. Result: 1 passed. The test runs in the frontend-new shell with contract-shaped mock data, captures list/detail/probe/WeCom screenshots, and fails on unexpected console.error, pageerror, or API 4xx/5xx responses. This is L1 mock visual coverage only."
