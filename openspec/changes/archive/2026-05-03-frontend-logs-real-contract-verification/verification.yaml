change: frontend-logs-real-contract-verification
archiveReady: true
circuitBreaker:
  maxFreshAttemptsPerScenario: 3
  continueWhenBlocked: true
  blockingRule: "Static contract/code review, focused tests, and L1 mock visual evidence remain mandatory. L2 real Logs API/UI may be classified as real-empty-valid or quiet-stream handoff-blocked when the real Gateway is reachable but emits no lines/frames after bounded attempts."
entries:
  - scenarioId: baseline.logs-handoff
    ownerTask: "1.2-1.4"
    status: passed
    verificationCommand: "Smoke-test deck-go/frontend-handoff/modules/logs/prototype.html and inspect archived frontend-logs-hifi-contract-redesign evidence"
    evidence: "Inspected v2 handoff file inventory, archived frontend-logs-hifi-contract-redesign, and current frontend-logs-hifi-redesign spec. Prototype loaded over local static server with HTTP 200, title `Log viewer`, 124 rows, filter bar present, and no browser errors."
  - scenarioId: audit.logs-bff-capability
    ownerTask: "2.1-2.6"
    status: passed
    verificationCommand: "Inspect DTOs, endpoint/stream classification, Go BFF routes/streaming, frontend wrappers, and production Logs code"
    evidence: "Confirmed DeckGoLogsTailResponse/DeckGoLogStreamEvent, endpoint classification GET /logs, stream contract GET /logs/stream, Gateway logs.tail upstream-schema-missing exception, Go BFF forwarding and SSE polling, frontend fetchLogsTail/streamLogEvents wrappers, and BFF-only browser access."
  - scenarioId: contract.logs-chain-matrix
    ownerTask: "2.5,3.1-3.5"
    status: passed
    verificationCommand: "Record workflow -> wrapper -> endpoint/DTO/SSE -> Go route/runtime -> capability classification matrix"
    evidence: "Recorded matrix in deck-go/frontend-handoff/modules/logs/implementation-notes.md; tail/stream/local filters/details/raw/export-preview are supported or degraded local, typed DeckGoLogLine/server-side filters/durable export are unsupported follow-up."
  - scenarioId: implementation.logs-v2-and-scoped-fixes
    ownerTask: "3.2-3.4"
    status: passed
    verificationCommand: "Implement v2 production UI and verify deterministic Logs-scoped fixes"
    evidence: "Rebuilt production Logs workbench with KPI strip, local filters, selected-line details, raw payloads, live tape, export preview, and defensive unknown[] parsing; fixed handoff route drift and log.reset payload docs; enriched mock Gateway log fixture."
  - scenarioId: frontend.logs-focused-tests
    ownerTask: "4.1"
    status: passed
    verificationCommand: "Run focused frontend tests for deck-go/frontend-new Logs"
    evidence: "cd deck-go/frontend-new && npm run test:deck-ui -- src/api.chat-helpers.test.ts src/components/panels/logs/LogsPanel.test.tsx passed, 48 tests."
  - scenarioId: backend.logs-focused-tests
    ownerTask: "4.2"
    status: passed
    verificationCommand: "Run focused Go tests for log routes/stream behavior"
    evidence: "cd deck-go/backend && go test ./internal/server ./internal/api/http ./internal/runtime/openclaw -run 'TestGatewayFacade_LogsAndGatewayHealth|TestGatewayFacade_LogsStream|TestLogsStreamBatchFormat|TestMountAdminRoutes|TestManagedRuntime|TestGatewayQueries' passed."
  - scenarioId: visual.logs-mock-e2e
    ownerTask: "4.3"
    status: passed
    verificationCommand: "Run Logs mock/local visual Playwright E2E and label evidence as L1 mock/local visual coverage"
    evidence: "cd deck-go && pnpm exec playwright test test/e2e/logs-visual.spec.ts --config playwright.config.ts passed, 1 test."
  - scenarioId: l2.logs-real-api-ui
    ownerTask: "4.4-4.5"
    status: passed
    maxAttempts: 3
    verificationCommand: "Real stack API/UI smoke for runtime readiness, logs tail response shape, stream behavior, production Logs render, filters, selected detail, and non-mutating controls"
    evidence: "cd deck-go && DECK_GO_REAL_GATEWAY_E2E=1 pnpm exec playwright test test/e2e/logs-real-gateway.spec.ts --config playwright.config.ts passed, 2 tests. Attempt 1 exposed a strict locator issue in the test selector; fixed and reran successfully. Real stream reachability test completed without quiet-timeout."
  - scenarioId: review.code-level
    ownerTask: "5.1-5.2"
    status: passed
    verificationCommand: "Manual code review of Logs panel, API facade, Go routes/streaming, contracts, mocks, and verification evidence"
    evidence: "Reviewed production parser/UI, fetchLogsTail/streamLogEvents wrapper boundaries, Go /logs and /logs/stream surfaces, Gateway logs.tail exception, mock fixture enrichment, L1/L2 tests, and handoff notes; residual risks recorded in implementation-notes.md."
  - scenarioId: final.openspec-and-build
    ownerTask: "4.6-4.9,5.4"
    status: passed
    verificationCommand: "openspec validate frontend-logs-real-contract-verification --strict; relevant contract checks; make frontend-build; git diff --check"
    evidence: "openspec validate frontend-logs-real-contract-verification --strict passed; cd deck-go && make frontend-build passed; git diff --check passed. No source contract changed in this Logs pass, so contract regeneration/check was not applicable."
