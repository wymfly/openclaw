change: frontend-routing-real-contract-verification
archiveReady: true
circuitBreaker:
  maxFreshAttemptsPerScenario: 3
  continueWhenBlocked: true
  blockingRule: "Static contract/code review, focused tests, and L1 mock visual evidence remain mandatory. L2 real Gateway routing state, config mutation safety, activity availability, or Gateway method support may be empty-valid, degraded, skipped-safe, or handoff-blocked when bounded attempts show an environment or safety blocker."
entries:
  - scenarioId: baseline.routing-handoff
    ownerTask: "1.2-1.4"
    status: passed
    verificationCommand: "Smoke-test deck-go/frontend-handoff/modules/routing/prototype.html and inspect frontend-routing-hifi-redesign evidence"
    evidence: "Inspected refreshed v2 multi-file routing handoff and current production Routing implementation. Prototype smoke loaded via local static server; queue, simulator, and buttons rendered without browser errors."
  - scenarioId: audit.routing-bff-capability
    ownerTask: "2.1-2.6"
    status: passed
    verificationCommand: "Inspect DTOs, endpoint classification, Go BFF/runtime routes, Gateway method mapping, frontend wrappers, and production Routing code"
    evidence: "Audited DeckGoRouting DTOs, endpoint classification, /api/deck/routing BFF, runtime route mirror, generated deck.routing.* Gateway methods, frontend wrappers, config patch reuse, and production Routing panel behavior."
  - scenarioId: contract.routing-chain-matrix
    ownerTask: "2.5,3.1-3.5"
    status: passed
    verificationCommand: "Record workflow -> wrapper -> endpoint/DTO -> Go route/runtime/Gateway -> capability classification matrix"
    evidence: "Recorded matrix in deck-go/frontend-handoff/modules/routing/implementation-notes.md. List/validate/add/remove/simulate/scope patch are supported; reorder is supported as remove+add workaround; activity is empty-valid/degraded."
  - scenarioId: implementation.routing-v2-and-scoped-fixes
    ownerTask: "3.2-3.4"
    status: passed
    verificationCommand: "Implement deterministic UI/docs/test/BFF fixes and verify unsupported prototype workflows remain inactive, degraded, or documented"
    evidence: "Added v2 inline confirmation for add/remove/reorder/scope patch, collapsed Add Binding draft by default, refreshed i18n/tests/mock visual coverage, expanded Go BFF route forwarding tests, and documented unsupported reorder/severity/reason/history gaps."
  - scenarioId: frontend.routing-focused-tests
    ownerTask: "4.1"
    status: passed
    verificationCommand: "Run focused frontend tests for deck-go/frontend-new Routing"
    evidence: "cd deck-go/frontend-new && npm run test:deck-ui -- src/components/panels/routing/RoutingPanel.test.tsx src/api.chat-helpers.test.ts passed: 2 files, 56 tests."
  - scenarioId: backend.routing-focused-tests
    ownerTask: "4.2"
    status: passed
    verificationCommand: "Run focused Go tests for routing routes and action envelopes"
    evidence: "cd deck-go/backend && go test ./internal/server ./internal/runtime/openclaw -run 'TestGatewayFacade_DeckRouting|TestGatewayQueriesTyped' passed."
  - scenarioId: visual.routing-mock-e2e
    ownerTask: "4.3"
    status: passed
    verificationCommand: "Run Routing mock/local visual Playwright E2E and label evidence as L1 mock/local visual coverage"
    evidence: "L1 mock/local visual coverage passed: cd deck-go && pnpm exec playwright test test/e2e/routing-visual.spec.ts --config playwright.config.ts."
  - scenarioId: l2.routing-real-api-ui
    ownerTask: "4.4-4.5"
    status: passed
    maxAttempts: 3
    verificationCommand: "Real stack API/UI smoke for routing list, simulate, validate, safe mutation shape, production render, and no direct browser HTTP/WebSocket calls to real Gateway"
    evidence: "L2 real Gateway E2E passed on first fresh attempt: cd deck-go && DECK_GO_REAL_GATEWAY_E2E=1 pnpm exec playwright test test/e2e/routing-real-gateway.spec.ts --config playwright.config.ts. Verified route shapes, safe invalid-hash mutation shape, production render, and BFF-only browser access."
  - scenarioId: review.code-level
    ownerTask: "5.1-5.2"
    status: passed
    verificationCommand: "Manual code review of Routing panel, API facade, Go routes/runtime, contracts, mocks, and verification evidence"
    evidence: "Reviewed Routing panel/API/BFF route changes and verification evidence. Remaining items are documented capability/product gaps: no first-class reorder, no conflict severity, no tier reason text, no durable routing activity history."
  - scenarioId: final.openspec-and-build
    ownerTask: "4.6-4.9,5.4"
    status: passed
    verificationCommand: "openspec validate frontend-routing-real-contract-verification --strict; relevant contract checks; make frontend-build; git diff --check"
    evidence: "openspec validate frontend-routing-real-contract-verification --strict passed; cd deck-go && make endpoint-classification-check passed; cd deck-go && make frontend-build passed; git diff --check passed."
