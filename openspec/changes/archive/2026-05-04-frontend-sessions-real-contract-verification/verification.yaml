change: frontend-sessions-real-contract-verification
archiveReady: true
circuitBreaker:
  maxFreshAttemptsPerScenario: 3
  continueWhenBlocked: true
  blockingRule: "Static contract/code review, focused tests, and L1 mock visual evidence remain mandatory. L2 real Gateway Sessions reads may be degraded or empty-valid; reset/clear/delete/compact/patch/branch/restore mutations may be skipped-safe when session state, compaction state, or operator-state safety blocks fresh evidence."
entries:
  - scenarioId: baseline.sessions-handoff
    ownerTask: "1.2-1.4"
    status: passed
    verificationCommand: "Smoke-test deck-go/frontend-handoff/modules/sessions/prototype.html and inspect frontend-sessions-hifi-redesign evidence"
    evidence: "Prototype smoke passed via local http.server + Playwright: title `deck-go sessions prototype`, 19 buttons, no browser console/page errors. Handoff package and current hifi spec were inspected."
  - scenarioId: audit.sessions-bff-capability
    ownerTask: "2.1-2.6"
    status: passed
    verificationCommand: "Inspect DTOs, endpoint classification, UI metadata, Go BFF session/chat/usage/compaction/subagent routes, frontend wrappers, and mock fixtures"
    evidence: "Audited Deck DTO authority, endpoint classification, UI metadata, frontend api.ts wrappers, SessionsPanel/helpers/tests, Go server/admin/runtime routes, generated Gateway wrappers, and mock Gateway session fixtures."
  - scenarioId: contract.sessions-chain-matrix
    ownerTask: "2.5,3.1-3.6"
    status: passed
    verificationCommand: "Record workflow -> wrapper -> endpoint/DTO/Gateway method -> Go route -> capability classification matrix"
    evidence: "Matrix recorded in deck-go/frontend-handoff/modules/sessions/implementation-notes.md for inventory, preview, detail, history/cache, export, usage/logs, compaction, lineage, parent/child navigation, mutations, BFF-only behavior, and projected cursor/live-refresh work."
  - scenarioId: implementation.sessions-scoped-fixes
    ownerTask: "3.2-3.6"
    status: passed
    verificationCommand: "Implement deterministic UI/docs/test/contract fixes and verify unsupported projected workflows remain inactive, degraded, skipped-safe, or documented"
    evidence: "Fixed Sessions UI metadata coverage, added DeckGoChatCompactRequest, typed compactChatSession() with that DTO, regenerated Deck API/UI metadata artifacts/docs, and added L2 sessions-real-gateway.spec.ts. No broad UI rewrite was needed."
  - scenarioId: frontend.sessions-focused-tests
    ownerTask: "4.1"
    status: passed
    verificationCommand: "Run focused frontend tests for deck-go/frontend-new Sessions"
    evidence: "cd deck-go/frontend-new && npm run test:deck-ui -- src/components/panels/sessions/SessionsPanel.test.tsx passed: 1 file, 11 tests."
  - scenarioId: backend.sessions-focused-tests
    ownerTask: "4.2"
    status: passed
    verificationCommand: "Run focused Go tests for Sessions, chat mutations, compaction, usage/context, subagent lineage, and generated Gateway wrappers"
    evidence: "cd deck-go/backend && GOCACHE=/tmp/deck-go-buildcache go test ./internal/server ./internal/api/http ./internal/runtime/openclaw passed."
  - scenarioId: visual.sessions-mock-e2e
    ownerTask: "4.3"
    status: passed
    verificationCommand: "Run Sessions mock/local visual Playwright E2E and label evidence as L1 mock/local visual coverage"
    evidence: "cd deck-go && pnpm exec playwright test test/e2e/sessions-visual.spec.ts --config playwright.config.ts passed, 1 test. Evidence is L1 mock/local visual coverage only."
  - scenarioId: l2.sessions-real-api-ui
    ownerTask: "4.4-4.5"
    status: passed
    maxAttempts: 3
    verificationCommand: "Real stack API/UI smoke for Sessions safe read paths, empty/degraded handling, skipped-safe mutation boundaries, and no direct browser Gateway calls"
    evidence: "cd deck-go && DECK_GO_REAL_GATEWAY_E2E=1 pnpm exec playwright test test/e2e/sessions-real-gateway.spec.ts --config playwright.config.ts passed, 2 tests. Safe reads, optional degraded/empty paths, missing-key mutation rejection, and BFF-only browser access were verified."
  - scenarioId: review.code-level
    ownerTask: "5.1-5.2"
    status: passed
    verificationCommand: "Manual code review of Sessions panel, API facade, Go routes/runtime, contracts, mocks, and verification evidence"
    evidence: "Reviewed Sessions panel/helpers, api.ts wrappers, Go BFF/runtime route mappings, contracts/generated output, mock fixtures, L1/L2 tests, and handoff docs. Residual cursor/live-refresh/destructive-real-mutation risks are recorded in implementation-notes.md."
  - scenarioId: final.openspec-and-build
    ownerTask: "4.6-4.9,5.4"
    status: passed
    verificationCommand: "openspec validate; relevant contract checks; make frontend-build; git diff --check"
    evidence: "openspec change validate frontend-sessions-real-contract-verification --strict, make contracts-check, make ui-metadata-check, make contract-gate, make frontend-build, and git diff --check passed."
