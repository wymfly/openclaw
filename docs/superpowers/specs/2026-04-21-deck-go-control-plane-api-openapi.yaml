openapi: 3.1.0
info:
  title: OpenClaw Deck Control Plane API
  version: 0.1.0-stage2
  summary: Stage 2 target query/command HTTP contract for the control plane
servers:
  - url: /api/v1
paths:
  /settings:
    get:
      summary: Fetch deck-go settings snapshot
      operationId: getDeckGoSettings
      responses:
        "200":
          description: Deck-go settings payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    put:
      summary: Update deck-go settings snapshot
      operationId: updateDeckGoSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Deck-go settings update payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /settings/test-connection:
    post:
      summary: Test deck-go gateway connection settings
      operationId: testDeckGoSettingsConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                token:
                  type: string
              required: [url]
      responses:
        "200":
          description: Settings connection test payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /settings/version:
    get:
      summary: Fetch deck-go version snapshot
      operationId: getDeckGoSettingsVersion
      responses:
        "200":
          description: Deck-go version payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /alerts:
    get:
      summary: Fetch alert rules
      operationId: listAlertRules
      responses:
        "200":
          description: Alert rule list payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      summary: Create an alert rule
      operationId: createAlertRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: Alert rule create payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /alerts/{ruleId}:
    patch:
      summary: Update an alert rule
      operationId: updateAlertRule
      parameters:
        - name: ruleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Alert rule update payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    delete:
      summary: Delete an alert rule
      operationId: deleteAlertRule
      parameters:
        - name: ruleId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Alert rule delete payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /webhooks:
    get:
      summary: Fetch webhook inventory
      operationId: listWebhooks
      responses:
        "200":
          description: Webhook collection payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      summary: Create a webhook
      operationId: createWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: Webhook create payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /webhooks/{webhookId}:
    patch:
      summary: Update a webhook
      operationId: updateWebhook
      parameters:
        - name: webhookId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Webhook update payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    delete:
      summary: Delete a webhook
      operationId: deleteWebhook
      parameters:
        - name: webhookId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Webhook delete payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /webhooks/{webhookId}/deliveries:
    get:
      summary: Fetch webhook delivery history
      operationId: listWebhookDeliveries
      parameters:
        - name: webhookId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Webhook delivery history payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /webhooks/{webhookId}/test:
    post:
      summary: Trigger a webhook test delivery
      operationId: testWebhook
      parameters:
        - name: webhookId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Webhook test payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /logs:
    get:
      summary: Tail gateway logs
      operationId: getLogs
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: maxBytes
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Logs tail payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /logs/stream:
    get:
      summary: Stream gateway logs over SSE
      operationId: streamLogs
      responses:
        "200":
          description: SSE log stream
          content:
            text/event-stream:
              schema:
                type: string
  /onboarding/status:
    get:
      summary: Fetch onboarding status
      operationId: getOnboardingStatus
      responses:
        "200":
          description: Onboarding status payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /onboarding/test-connection:
    post:
      summary: Test onboarding gateway connection
      operationId: testOnboardingConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Onboarding connection test payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /onboarding/save-settings:
    post:
      summary: Save onboarding settings
      operationId: saveOnboardingSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Onboarding save payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /docs:
    get:
      summary: Fetch extracted docs
      operationId: listDocs
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Docs collection payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /docs/{docId}:
    get:
      summary: Fetch one extracted doc
      operationId: getDoc
      parameters:
        - name: docId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Doc payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    delete:
      summary: Delete one extracted doc
      operationId: deleteDoc
      parameters:
        - name: docId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Doc delete payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /docs/extract:
    post:
      summary: Extract docs from a session transcript
      operationId: extractDocs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionKey:
                  type: string
              required: [sessionKey]
      responses:
        "200":
          description: Docs extract payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /memory/browse:
    get:
      summary: Browse agent memory files
      operationId: browseMemory
      parameters:
        - name: agentId
          in: query
          required: true
          schema:
            type: string
        - name: path
          in: query
          required: false
          schema:
            type: string
        - name: read
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Memory browse payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /memory/search:
    get:
      summary: Search memory
      operationId: searchMemory
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: agentId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Memory search payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /stream:
    get:
      summary: Stream control-plane events over SSE
      operationId: streamControlPlaneEvents
      responses:
        "200":
          description: SSE control-plane event stream
          content:
            text/event-stream:
              schema:
                type: string
  /chat/session-events:
    post:
      summary: Subscribe or unsubscribe from chat session events
      operationId: updateChatSessionEventSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Session event subscription payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /chat/projection:
    post:
      summary: Persist chat projection compatibility payload
      operationId: persistChatProjection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Chat projection payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /chat/compaction:
    post:
      summary: Run chat compaction checkpoint actions
      operationId: runChatCompactionAction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Chat compaction payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /chat/steer:
    post:
      summary: Steer a running chat session
      operationId: steerChatSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Chat steer payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /usage/budget:
    get:
      summary: Fetch budget rules
      operationId: listBudgetRules
      responses:
        "200":
          description: Budget rule collection payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      summary: Create a budget rule
      operationId: createBudgetRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: Budget rule create payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /usage/budget/{ruleId}:
    patch:
      summary: Update a budget rule
      operationId: updateBudgetRule
      parameters:
        - name: ruleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Budget rule update payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    delete:
      summary: Delete a budget rule
      operationId: deleteBudgetRule
      parameters:
        - name: ruleId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Budget rule delete payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /usage/budget/evaluate:
    get:
      summary: Evaluate budget rules
      operationId: evaluateBudgetRules
      responses:
        "200":
          description: Budget evaluation payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /usage/cost:
    get:
      summary: Fetch usage cost breakdown
      operationId: getUsageCost
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Usage cost payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /usage/sessions:
    get:
      summary: Fetch session usage summaries
      operationId: getUsageSessions
      parameters:
        - name: startDate
          in: query
          required: false
          schema:
            type: string
        - name: endDate
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: key
          in: query
          required: false
          schema:
            type: string
        - name: includeContextWeight
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Session usage payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /usage/sessions/logs:
    get:
      summary: Fetch session usage logs
      operationId: getUsageSessionLogs
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Session usage logs payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /usage/timeseries:
    get:
      summary: Fetch usage timeseries data
      operationId: getUsageTimeseries
      parameters:
        - name: key
          in: query
          required: false
          schema:
            type: string
        - name: startDate
          in: query
          required: false
          schema:
            type: string
        - name: endDate
          in: query
          required: false
          schema:
            type: string
        - name: mode
          in: query
          required: false
          schema:
            type: string
        - name: utcOffset
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Usage timeseries payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /models/config:
    get:
      summary: Fetch model configuration
      operationId: getModelsConfig
      responses:
        "200":
          description: Model config payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    patch:
      summary: Patch model configuration
      operationId: patchModelsConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Model config patch payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /models/usage/providers:
    get:
      summary: Fetch model usage providers
      operationId: getModelUsageProviders
      responses:
        "200":
          description: Model usage providers payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /models/usage/cost:
    get:
      summary: Fetch model usage cost
      operationId: getModelUsageCost
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Model usage cost payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /media:
    get:
      summary: Fetch a media asset
      operationId: getMediaAsset
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
        - name: dl
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Media asset response
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /canvas/{assetPath}:
    get:
      summary: Fetch a canvas host asset
      operationId: getCanvasAsset
      parameters:
        - name: assetPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Canvas asset response
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            text/html:
              schema:
                type: string
  /deck/canvas:
    post:
      summary: Update deck canvas ready/eval state
      operationId: updateDeckCanvasState
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Deck canvas payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /runtimes:
    get:
      summary: List registered runtimes
      operationId: listRuntimes
      responses:
        "200":
          description: Runtime collection
          content:
            application/json:
              schema:
                type: object
                properties:
                  runtimes:
                    type: array
                    items:
                      $ref: "#/components/schemas/RuntimeSummary"
                  requestId:
                    type: string
                required: [runtimes, requestId]
  /runtimes/{runtimeId}:
    get:
      summary: Fetch one runtime summary
      operationId: getRuntime
      parameters:
        - $ref: "#/components/parameters/RuntimeId"
      responses:
        "200":
          description: Runtime summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  runtime:
                    $ref: "#/components/schemas/RuntimeSummary"
                  requestId:
                    type: string
                required: [runtime, requestId]
        "404":
          $ref: "#/components/responses/Error"
  /runtimes/{runtimeId}/sessions:
    get:
      summary: List sessions for a runtime
      operationId: listSessions
      parameters:
        - $ref: "#/components/parameters/RuntimeId"
      responses:
        "200":
          description: Session collection
          content:
            application/json:
              schema:
                type: object
                properties:
                  runtimeId:
                    type: string
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/SessionSummary"
                  requestId:
                    type: string
                required: [runtimeId, sessions, requestId]
  /runtimes/{runtimeId}/sessions/{sessionId}/timeline:
    get:
      summary: Fetch the projected timeline snapshot for one session
      operationId: getSessionTimeline
      parameters:
        - $ref: "#/components/parameters/RuntimeId"
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Timeline snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineSnapshotEnvelope"
        "404":
          $ref: "#/components/responses/Error"
  /runtimes/{runtimeId}/runs:
    get:
      summary: List projected runs for a runtime
      operationId: listRuns
      parameters:
        - $ref: "#/components/parameters/RuntimeId"
      responses:
        "200":
          description: Run collection
          content:
            application/json:
              schema:
                type: object
                properties:
                  runtimeId:
                    type: string
                  runs:
                    type: array
                    items:
                      $ref: "#/components/schemas/RunSummary"
                  requestId:
                    type: string
                required: [runtimeId, runs, requestId]
        "404":
          $ref: "#/components/responses/Error"
  /runtimes/{runtimeId}/activity:
    get:
      summary: List projected activity entries for a runtime
      operationId: listActivity
      parameters:
        - $ref: "#/components/parameters/RuntimeId"
      responses:
        "200":
          description: Activity collection
          content:
            application/json:
              schema:
                type: object
                properties:
                  runtimeId:
                    type: string
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/ActivityEvent"
                  requestId:
                    type: string
                required: [runtimeId, events, requestId]
        "404":
          $ref: "#/components/responses/Error"
  /runtimes/{runtimeId}/runs/{runId}:
    get:
      summary: Fetch one projected run detail
      operationId: getRun
      parameters:
        - $ref: "#/components/parameters/RuntimeId"
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunDetailEnvelope"
        "404":
          $ref: "#/components/responses/Error"
  /runtimes/{runtimeId}/stats:
    get:
      summary: Fetch projected monitor statistics for a runtime
      operationId: getRuntimeStats
      parameters:
        - $ref: "#/components/parameters/RuntimeId"
      responses:
        "200":
          description: Runtime monitor stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorStatsEnvelope"
        "404":
          $ref: "#/components/responses/Error"
  /runtimes/{runtimeId}/gateway/health:
    get:
      summary: Fetch gateway health diagnostics for a runtime
      operationId: getRuntimeGatewayHealth
      parameters:
        - $ref: "#/components/parameters/RuntimeId"
      responses:
        "200":
          description: Runtime gateway health payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayHealthEnvelope"
        "404":
          $ref: "#/components/responses/Error"
  /runtimes/{runtimeId}/gateway/describe:
    get:
      summary: Fetch gateway capability description for a runtime
      operationId: getRuntimeGatewayDescribe
      parameters:
        - $ref: "#/components/parameters/RuntimeId"
        - name: includeSchemas
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Runtime gateway description payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDescribeEnvelope"
        "404":
          $ref: "#/components/responses/Error"
  /runtimes/{runtimeId}/gateway/status:
    get:
      summary: Fetch gateway status diagnostics for a runtime
      operationId: getRuntimeGatewayStatus
      parameters:
        - $ref: "#/components/parameters/RuntimeId"
      responses:
        "200":
          description: Runtime gateway status payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayStatusEnvelope"
        "404":
          $ref: "#/components/responses/Error"
  /runtimes/{runtimeId}/devices:
    get:
      summary: Fetch device inventory for a runtime
      operationId: listRuntimeDevices
      parameters:
        - $ref: "#/components/parameters/RuntimeId"
      responses:
        "200":
          description: Runtime device inventory payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicesEnvelope"
        "404":
          $ref: "#/components/responses/Error"
  /runtimes/{runtimeId}/devices/self:
    get:
      summary: Fetch the local device identity for a runtime
      operationId: getRuntimeDeviceSelf
      parameters:
        - $ref: "#/components/parameters/RuntimeId"
      responses:
        "200":
          description: Runtime device identity payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceSelfEnvelope"
        "404":
          $ref: "#/components/responses/Error"
  /runtimes/{runtimeId}/devices/approve:
    post:
      summary: Approve a pending device request
      operationId: approveRuntimeDeviceRequest
      parameters:
        - $ref: "#/components/parameters/RuntimeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                requestId:
                  type: string
              required: [requestId]
      responses:
        "200":
          description: Device request approved
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /runtimes/{runtimeId}/devices/reject:
    post:
