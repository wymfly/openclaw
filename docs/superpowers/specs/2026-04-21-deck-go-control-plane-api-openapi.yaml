components:
  parameters:
    RuntimeId:
      name: runtimeId
      in: path
      required: true
      schema:
        type: string
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: idempotencyKey
      in: header
      required: false
      schema:
        type: string
  responses:
    Error:
      description: Standard control-plane error envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    RuntimeSummary:
      type: object
      properties:
        runtimeId:
          type: string
        managed:
          type: boolean
        configured:
          type: boolean
        status:
          type: string
        health:
          type: string
        capabilityVersion:
          type: string
          nullable: true
        methodCount:
          type: integer
          nullable: true
        eventCount:
          type: integer
          nullable: true
        gatewayUrl:
          type: string
          nullable: true
        lastError:
          type: string
          nullable: true
        autoStart:
          type: boolean
        occurredAt:
          type: string
          format: date-time
      required: [runtimeId, status, health, occurredAt]
    SessionSummary:
      type: object
      properties:
        runtimeId:
          type: string
        sessionId:
          type: string
        title:
          type: string
          nullable: true
        status:
          type: string
        updatedAt:
          type: string
          format: date-time
      required: [runtimeId, sessionId, status, updatedAt]
    TimelineSnapshotEnvelope:
      type: object
      properties:
        runtimeId:
          type: string
        sessionId:
          type: string
        timeline:
          type: array
          items:
            type: object
            additionalProperties: true
        activeRun:
          type: object
          additionalProperties: true
          nullable: true
        requestId:
          type: string
      required: [runtimeId, sessionId, timeline, requestId]
    RunSummary:
      type: object
      properties:
        runId:
          type: string
        agentId:
          type: string
          nullable: true
        sessionKey:
          type: string
          nullable: true
        status:
          type: string
        firstEventAt:
          type: string
        lastEventAt:
          type: string
        eventCount:
          type: integer
        toolCalls:
          type: integer
        modelCalls:
          type: integer
        fileOps:
          type: integer
        subagentSpawns:
          type: integer
        totalTokens:
          type: integer
        compacted:
          type: boolean
      required: [runId, status, firstEventAt, lastEventAt, eventCount]
    ActivityEvent:
      type: object
      properties:
        id:
          type: string
        timestamp:
          type: integer
        type:
          type: string
        agentId:
          type: string
          nullable: true
        agentName:
          type: string
          nullable: true
        description:
          type: string
        details:
          type: string
          nullable: true
      required: [id, timestamp, type, description]
    RunEventRow:
      type: object
      properties:
        id:
          type: integer
        run_id:
          type: string
        seq:
          type: integer
        stream:
          type: string
        data:
          type: string
        agent_id:
          type: string
          nullable: true
        session_key:
          type: string
          nullable: true
        created_at:
          type: string
      required: [id, run_id, seq, stream, data, created_at]
    RunDetailEnvelope:
      type: object
      properties:
        runtimeId:
          type: string
        runId:
          type: string
        run:
          $ref: "#/components/schemas/RunSummary"
        events:
          type: array
          items:
            $ref: "#/components/schemas/RunEventRow"
        requestId:
          type: string
      required: [runtimeId, runId, run, events, requestId]
    MonitorStats:
      type: object
      properties:
        totalRuns:
          type: integer
        todayRuns:
          type: integer
        avgDurationMs:
          type: integer
        topAgents:
          type: array
          items:
            type: object
            properties:
              agentId:
                type: string
              runCount:
                type: integer
            required: [agentId, runCount]
      required: [totalRuns, todayRuns, avgDurationMs, topAgents]
    MonitorStatsEnvelope:
      type: object
      properties:
        runtimeId:
          type: string
        stats:
          $ref: "#/components/schemas/MonitorStats"
        requestId:
          type: string
      required: [runtimeId, stats, requestId]
    GatewayHealthEnvelope:
      type: object
      properties:
        runtimeId:
          type: string
        health:
          type: object
          additionalProperties: true
        requestId:
          type: string
      required: [runtimeId, health, requestId]
    GatewayDescribeEnvelope:
      type: object
      properties:
        runtimeId:
          type: string
        describe:
          type: object
          additionalProperties: true
        requestId:
          type: string
      required: [runtimeId, describe, requestId]
    GatewayStatusEnvelope:
      type: object
      properties:
        runtimeId:
          type: string
        status:
          type: object
          additionalProperties: true
        requestId:
          type: string
      required: [runtimeId, status, requestId]
    DevicesEnvelope:
      type: object
      properties:
        runtimeId:
          type: string
        devices:
          type: object
          additionalProperties: true
        requestId:
          type: string
      required: [runtimeId, devices, requestId]
    DeviceSelfEnvelope:
      type: object
      properties:
        runtimeId:
          type: string
        deviceId:
          type: string
          nullable: true
        requestId:
          type: string
      required: [runtimeId, deviceId, requestId]
    OpaquePayloadEnvelope:
      type: object
      properties:
        runtimeId:
          type: string
        payload:
          type: object
          additionalProperties: true
        requestId:
          type: string
      required: [runtimeId, payload, requestId]
    ConfigEnvelope:
      type: object
      properties:
        runtimeId:
          type: string
        config:
          type: object
          additionalProperties: true
        requestId:
          type: string
      required: [runtimeId, config, requestId]
    ConfigSchemaEnvelope:
      type: object
      properties:
        runtimeId:
          type: string
        schema:
          type: object
          additionalProperties: true
        requestId:
          type: string
      required: [runtimeId, schema, requestId]
    AgentPayloadEnvelope:
      type: object
      properties:
        runtimeId:
          type: string
        agentId:
          type: string
        payload:
          type: object
          additionalProperties: true
        requestId:
          type: string
      required: [runtimeId, agentId, payload, requestId]
    AgentFilePayloadEnvelope:
      type: object
      properties:
        runtimeId:
          type: string
        agentId:
          type: string
        name:
          type: string
        payload:
          type: object
          additionalProperties: true
        requestId:
          type: string
      required: [runtimeId, agentId, name, payload, requestId]
    ChannelThroughputEnvelope:
      type: object
      properties:
        runtimeId:
          type: string
        channelId:
          type: string
        payload:
          type: object
          additionalProperties: true
        requestId:
          type: string
      required: [runtimeId, channelId, payload, requestId]
    SessionCreateResponse:
      type: object
      properties:
        ok:
          type: boolean
        key:
          type: string
        sessionId:
          type: string
        runId:
          type: string
        status:
          type: string
        messageSeq:
          type: number
        interruptedActiveRun:
          type: boolean
        runStarted:
          type: boolean
        runError:
          nullable: true
        entry:
          type: object
          additionalProperties: true
      required: [ok, key, sessionId, entry, runStarted]
    CommandAcceptedEnvelope:
      type: object
      properties:
        accepted:
          type: boolean
        requestId:
          type: string
        commandId:
          type: string
        submittedAt:
          type: string
          format: date-time
      required: [accepted, requestId, commandId, submittedAt]
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              nullable: true
          required: [code, message, details]
        requestId:
          type: string
      required: [error, requestId]
