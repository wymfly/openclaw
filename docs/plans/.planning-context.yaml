# Key context
context:
  existing_components: |
    Chat panel:
      MessageInput.tsx — 聊天输入框，集成 slash command 检测 + 执行 + action handling
      SlashCommandPalette.tsx — 命令面板 Popover（输入 / 触发），硬编码 ICON_MAP
