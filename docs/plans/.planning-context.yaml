      slash-command-executor.ts — 命令执行引擎（switch dispatch + API 调用 + toast 反馈 + configUpdate）
      SessionConfigBar.tsx — 常驻配置状态条（model/thinking/fast/verbose）
      ChatPanel.tsx — 面板容器，挂载 SessionConfigBar + MessageInput
    Notifications:
      ToastContainer.tsx — 固定位置 toast 渲染（右上角）
      notifications.ts — useNotificationsStore（addToast/dismissToast）
    Gateway (deck/ 目录):
      src/gateway/server-methods/deck/ — fork 自有 RPC handlers
      src/gateway/protocol/schema/ — TypeBox schema definitions
      dashboard/server/gateway-allowlist.ts — RPC 白名单
  existing_stores: |
    chat-types.ts — SessionMeta（含 thinkingLevel/fastMode/verboseLevel/model 字段）
    chat-dispatchers.ts — sessions.changed SSE 事件处理、updateSessionMeta
    chat.ts — chat store 主文件
    notifications.ts — Toast store
  prior_work: |
    deck-slash-command-coherence 已完成：
    - 14 命令端到端反馈自洽（toast + SessionConfigBar + 乐观更新 + SSE 校正）
    - SessionMeta 含 thinkingLevel/fastMode/verboseLevel
    - executor 返回 toastKey/toastValue/toastType/configUpdate
    - 未知命令兜底（regex guard）
  design_decisions: |
    D1: Map + Source Tagging registry（O(1) 查找，多来源标记）
    D2: deck.commands.discover RPC（聚合 built-in + skill + plugin 命令）
    D3: Local vs Remote 执行分流（local 直接执行，remote 通过 chat.send）
    D4: 混合来源分组面板（local categories + Skills + More 折叠）
    D5: 静态 + 动态参数系统（argOptions + argSchema）
    D6: visibleIf 上下文过滤（不影响手动执行）
    D7: Plugin 扩展点预留（类型 + UI + 优先级）
