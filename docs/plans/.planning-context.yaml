context:
  existing_components: |
    Gateway Protocol SDK:
      - method-registry-data (src/gateway/method-registry-data.ts): allMethodDefs + allMethodNames 聚合
      - protocol schema (src/gateway/protocol/schema/): TypeBox result schema 定义
      - protocol-gen-ts (scripts/protocol-gen-ts.ts): TypeScript codegen 脚本
      - server-methods (src/gateway/server-methods/): handler + methodDefs 导出
    Dashboard Transport:
      - api-helpers (dashboard/src/lib/api-helpers.ts): gwRequest (typed) + gatewayRequest (deprecated)
      - with-auth (dashboard/src/lib/with-auth.ts): 认证+限流中间件
      - generated types (dashboard/src/types/gateway-protocol.generated.ts): GatewayMethodMap
      - generated client (dashboard/src/types/gateway-client.generated.ts): GatewayClient + ALLOWLIST
    Dashboard Shell:
      - ui store (dashboard/src/stores/ui.ts): Panel type union (L18-41)
      - NavRail (dashboard/src/components/layout/NavRail.tsx): 导航栏 navGroups (L47-90) + settings (L215-231)
      - page.tsx (dashboard/src/app/page.tsx): lazy imports (L18-93) + ActivePanel (L124-177)
      - useKeyboardShortcuts (dashboard/src/hooks/useKeyboardShortcuts.ts): Alt+N (L10-20)
    Error Handling:
      - ErrorBody in api-helpers.ts (L14)
      - ErrorBody in with-auth.ts (L17)
      - ApiErrorBody in chat-api.ts (L33)
      - normalizeGatewayError in chat-api.ts
  design_decisions: |
    D1: 从 handler respond() 推导 TypeBox schema，遵循 Protocol SDK 设计
    D2: gwRequest 保持返回 NextResponse 不变，fetchApi 仅限客户端
    D3: 集中定义 PanelRegistry（非分散 registry.ts），支持 eager/position 标记
    D4: typed 判定基于 GatewayMethodMap keys（非 ALLOWLIST）

