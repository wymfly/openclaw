# 由 dev-workflow 自动生成，writing-plans 消费后可保留供 G2 参考
mode: 2                          # Mode 2 (OpenSpec 主导)
pre_g2: likely                   # specs/ = 4, tasks = 9

# 并行感知
parallel:
  enabled: true
  requirements:
    - file_list_per_task
    - cross_file_matrix
    - task_0_if_shared_interface
    - task_n_integration
    - resolve_conflicts

# OpenSpec 需求映射
openspec:
  change_name: "deck-execution-monitor"
  specs_path: "openspec/changes/deck-execution-monitor/specs/"
  design_path: "openspec/changes/deck-execution-monitor/design.md"
  requirements:
    - covers_field_per_task
    - coverage_matrix
    - no_orphan_requirements

# 任务分组提示（来自 OpenSpec tasks.md 分析）
task_groups:
  - name: "Backend: Persistence + Pipeline + API"
    description: "RunEventStore SQLite、Event Write Pipeline、Monitor API Routes"
    domain: "[backend]"
    serial: true  # 1→2→3 强串行依赖
  - name: "Frontend: Store + Panel Migration"
    description: "UI Store 迁移（activity→monitor）、NavRail/HeaderBar 更新"
    domain: "[frontend]"
    depends_on: "Backend (API shape)"
  - name: "Frontend: Monitor Panel Tabs"
    description: "Overview + Timeline + History 三个 tab"
    domain: "[frontend]"
    depends_on: "Store migration"
    parallel_within: true  # 5/6/7 可并行（不同 tab 组件）
  - name: "i18n + Integration"
    description: "国际化键 + 端到端验证"
    domain: "[frontend] [test]"
    depends_on: "All above"
