context:
  existing_components: |
    Wecom 插件入口:
      extensions/wecom/index.ts — register() 注册 Tool，当前仅 registerWecomDocTools(api)
    Doc 模块（四件套模式参考）:
      src/capability/doc/client.ts — WecomDocClient 类，postWecomDocApi() 含 3 次重试（:170-189）
      src/capability/doc/schema.ts — oneOf 判别联合 JSON Schema，action 字段分发
      src/capability/doc/tool.ts — registerWecomDocTools，action switch 分发到 client
      src/capability/doc/types.ts — TypeScript 类型定义
    共享基础设施:
      src/transport/agent-api/core.ts:87 — getAccessToken(agent) per-agent token 缓存
      src/http.ts:63 — wecomFetch() 统一 HTTP 层（代理+超时，无重试）
      src/config/network.ts:4 — resolveWecomEgressProxyUrlFromNetwork()
      src/capability/bot/fallback-delivery.ts:27 — resolveAgentAccountOrUndefined()
  design_decisions: |
    D1: 自研参考 wecom-cli，不直接集成（自建应用 API scope 更大）
    D2: 渠道与 Tool 暂不拆分，通过 getAccessToken(agent) 松耦合
    D3: 上游新增文件直接复制，已有文件不同步
    D4: 每个 client 复制重试 pattern，不提取共享函数（本期）
    D5: oneOf 判别联合 + action switch 分发（沿用 doc 模式）

