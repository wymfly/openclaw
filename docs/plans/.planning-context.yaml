# Key context
context:
  existing_components: |
    Sessions:
      SessionsPanel.tsx — split layout, left sidebar (session list + type filter) + right detail
      SessionList.tsx — renders session items with type icons, kind badges, status badges, context bar
      SessionDetail.tsx — header (key + status) + stats + context bar + subagent info + transcript
      TranscriptSearch.tsx — search within session history
      SessionExport.tsx — export session data
      ScopeSelector.tsx, ScopeStrategyCard.tsx — session scope selection (not directly involved)
    Logs:
      LogsPanel.tsx — toolbar (title + LogFilters + clear/pause buttons) + LogStream
      LogFilters.tsx — level checkboxes, source dropdown, session text input
      LogStream.tsx — auto-scrolling monospace log output with level badges
      useLogPolling.ts — 2s interval polling /api/logs with cursor + filter
  existing_stores: |
    sessions.ts — sessions[], selectedKey, history[], fetchSessions(), selectSession(), fetchHistory(), deleteSession(), applySessionChangedEvent()
      fetchSessions() → GET /api/sessions → gatewayRequest("sessions.list", {}) — 不传任何参数
      SessionEntry has: key, kind, model, tokensIn, tokensOut, contextWindow, updatedAt, status, totalTokens, estimatedCostUsd, parentSessionKey, childSessions, subagentRole, subagentControlScope, spawnedWorkspaceDir
    logs.ts — entries[], filters (levels, source, sessionKey), streaming, maxEntries=500
      addEntries() — 追加 + slice 裁剪到 maxEntries
      已有 setLevelFilter/setSourceFilter/setSessionFilter
  api_routes: |
    /api/sessions (GET) → sessions.list {} — 不传 search/limit/activeMinutes
    /api/sessions/[sessionKey] (GET) → chat.history, (DELETE) → sessions.delete
    /api/chat/sessions/patch (POST) → sessions.patch { key, ...params } — 已存在！
    /api/logs (GET) → logs.tail { cursor?, limit? } — 已支持 cursor
  gateway_params: |
    sessions.list params: limit?, activeMinutes?, includeGlobal?, includeUnknown?, includeDerivedTitles?, includeLastMessage?, label?, spawnedBy?, agentId?, search?
    sessions.patch params: key, label?, thinkingLevel?, fastMode?, verboseLevel?, reasoningLevel?, responseUsage?, elevatedLevel?, execHost?, execSecurity?
    logs.tail params: cursor?, limit?, maxBytes?
  shared_list_infra: |
    ListSearchBar — onSearch(query), debounceMs, matchCount, filters[], filterValues, onFilterChange()
      filters 支持 select/multiselect/text 类型
    InlineEdit — type="text"|"select", value, onConfirm(value), options[]
    PaginatedList — 分页列表（但 sessions.list 不支持 offset/page 参数，需客户端分页）
  key_observations: |
    1. useLogPolling 已有 cursor 逻辑！cursorRef 追踪，每次 poll 传入 cursor 参数。但过滤在 poll 层（丢弃不匹配的 entries），不是渲染层。
    2. logs store maxEntries=500，已有简单的 ring buffer（slice 裁剪），但上限太低。
    3. sessions.list 不支持 offset/page 参数，PaginatedList 需要用客户端分页模式。
    4. sessions.patch API route 已存在于 /api/chat/sessions/patch，可直接复用。
    5. LogFilters 已有 level checkbox UI，但过滤逻辑在 useLogPolling（丢弃不匹配条目）而非渲染层。
  i18n_namespace: "sessions（~45 key）和 logs（~16 key），需新增搜索、过滤、编辑、缓存计数相关 key"
