# Key context
context:
  existing_components: |
    ChannelsPanel.tsx — entry point, sidebar (30%) + detail (70%)
    ChannelList.tsx — sidebar with status indicators
    ChannelDetail.tsx — tabbed view (Status/Bindings/Settings)
    ChannelSettingsTab.tsx — hardcoded DmPolicy + RetryStrategy fields
    ConfigWizard.tsx — multi-step wizard dialog (Feishu/WeCom only)
    ThroughputChart.tsx — channel throughput chart
  existing_schema_infra: |
    SchemaForm.tsx — full schema-driven form renderer (config-editor)
    schema-parser.ts — parseSchemaSection(): JSON Schema → FormField[]
    ui-hints.ts — applyUiHints(): decorates FormField[] with configUiHints (sensitive, group, order, help, label, etc.)
    FieldHelpPopover, PasswordField, RecordField, TypedArrayField, UnionField, FieldValidation — all field components
  existing_stores: |
    channels.ts — fetchChannels(), selectChannel(), updateChannelConfig(), logoutChannel(),
      fetchChannelConfig(channelId), saveChannelConfig(channelId, patch) — already reads from config store
    config.ts — fetchSchema() → stores schema + uiHints from config.schema API
  existing_api_routes: |
    /api/config/schema — GET → config.schema RPC (returns { schema, uiHints, version })
    /api/config/schema-lookup — POST → config.schema.lookup RPC (returns sub-schema for a path)
    /api/channels — GET → channels.status RPC (returns channelOrder, channels, channelAccounts, channelLabels)
  gateway_apis: |
    All in generated allowlist:
    - config.schema {} → { schema, uiHints, version, generatedAt }
    - config.schema.lookup { path } → sub-schema for path
    - channels.status { probe?: boolean } → channel status + probeResult when probe=true
    - config.patch { patch, baseHash } → apply config patch
  reuse_strategy: |
    核心策略：复用已有 config-editor 的 SchemaForm 基础设施，不新建 ChannelSchemaForm。
    1. 从 config.schema 的 schema 中提取 channels.* 和 extensions.*.channel 子 schema
    2. 使用 parseSchemaSection() 解析为 FormField[]
    3. 使用 applyUiHints() 应用 configUiHints 装饰
    4. 直接渲染 SchemaForm 组件
    5. 保存通过 saveChannelConfig() (已有) 走 config.patch API
  design_decisions: |
    D1=轻量 wrapper 而非独立 SchemaForm（直接复用 config-editor 的 SchemaForm）
    D2=Schema 字段类型映射规则（已由 schema-parser.ts 实现）
    D3=渠道发现基于 config.schema 路径枚举
    D4=探测结果按需触发（"测试连接" 按钮）
  i18n_namespace: "channels（已有部分 key），需新增 schema 表单标签、探测状态文案、发现列表文案"
