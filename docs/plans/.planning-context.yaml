    input-history.ts: InputHistory class — 50 max, push/up/down/reset, dedup on adjacent
  gateway_apis: |
    All needed APIs are in generated allowlist:
    - sessions.compact (key) → compacts session context
    - sessions.patch (key, model?, thinkingLevel?, fastMode?, verboseLevel?) → updates session directives
    - sessions.abort (key, runId?) → aborts run (existing /api/chat/abort uses this)
    - sessions.list → session list with totalTokens, estimatedCostUsd, contextTokens
    - sessions.create (agentId, message?) → creates session
    - models.list → available models with catalog
  session_events: |
    sessions.changed events arrive via SSE "session-state" listener in useSessionEvents.ts
    dispatchSessionStateEvent() in chat-dispatchers.ts handles phase/reason
    applySessionChangedEvent() in sessions store updates totalTokens, estimatedCostUsd, contextTokens
    SessionMeta already has totalTokens, estimatedCostUsd fields
