context:
  existing_components: |
    ProjectionStore (dashboard/server/projection-store.ts):
      - SQLite-backed KV store, settings table (key/value/updated_at)
      - Chat-specific API: getChatSessionProjection/setChatSessionProjection/clearChatSessionProjection
      - Key prefix: "chat_projection:{sessionKey}"
      - Outbox API: appendEvent, getEventsSince(lastId, limit=500), outboxHead, pruneEvents
      - OutboxRow: { id, event_type, payload, created_at } — no domain column
      - getEventsSince returns OutboxEntry[] with no gap signal
    Approval Bridge (dashboard/server/approval-bridge.ts):
      - Server-side only, listens for Gateway exec.approval.* events
      - In-memory pendingMap for live sessions
      - persistApprovalProjection() does read-modify-write on chat blob (line 52-71)
      - Writes activeApproval INTO the chat projection blob (coupled)
    SSE Stream (dashboard/src/app/api/stream/route.ts):
      - Primary replay: runtime.store.getEventsSince(lastEventId) (line 132-134)
      - Fallback: bus.getEventsSince(lastEventId) (EventBus ring buffer)
      - No gap detection — silently drops events if lastEventId is pruned
    Snapshot (dashboard/src/app/api/chat/snapshot/route.ts):
      - Reads getChatSessionProjection(sessionKey) at line 73
      - Extracts activeApproval from chat blob (lines 74-79)
      - Response shape: { messages, meta, activeApproval, a2uiState }
    Production callers of chat-specific methods (6 files):
      - dashboard/src/app/api/chat/projection/route.ts (get/set/clear)
      - dashboard/src/app/api/chat/sessions/clear/route.ts (clear)
      - dashboard/src/app/api/chat/sessions/reset/route.ts (clear)
      - dashboard/server/approval-bridge.ts (get/set/clear via persistApprovalProjection)
      - dashboard/server/runtime.ts:124 (clear)
      - dashboard/src/app/api/chat/snapshot/route.ts (get)
  design_decisions: |
    D1: Generic KV API (not event-sourced) — getProjection<T>(domain, key) / setProjection<T>
    D2: Approval remains server-derived (not client-writable) — only approval-bridge writes
    D3: Gap signal (not full catch-up protocol) — gapDetected boolean + projection.gap SSE event
    D4: Internal server API only (no new HTTP endpoints in Phase 1)
    D5: Transaction-protected migration — SQLite transaction for legacy approval extraction

