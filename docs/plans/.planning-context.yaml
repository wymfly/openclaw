# Key context
context:
  existing_components: |
    ConfigPanel.tsx — main panel, toolbar + SectionNav (sidebar) + SchemaForm (content area)
    SchemaForm.tsx — schema-driven form renderer with field grouping, advanced section, field routing
    ConflictDialog.tsx — simple modal (reload/cancel only, no field-level diff)
    SectionNav.tsx — sidebar with section list, expandable children, field count badges
    DiffPreviewDialog.tsx — existing diff preview dialog
    FieldHelpPopover.tsx — help popover for fields
    SectionIntroCard.tsx — section description card
    fields/ — PasswordField, RecordField, TypedArrayField, UnionField, FieldValidation
  existing_infra: |
    schema-parser.ts — parseSchemaSection(): JSON Schema → FormField[]
      FormField has: key, type, description, options, children, tags, label, help, group, order, etc.
    ui-hints.ts — applyUiHints(): decorates FormField[] with configUiHints (sensitive, group, order, help, label, tags)
      UiHint has: sensitive, collapsed, placeholder, help, label, tags, group, order, advanced
  current_search: |
    ConfigPanel.tsx 没有搜索功能 — 无搜索栏，无文本过滤
    用户需要通过 SectionNav 手动导航到所需节
  current_conflict: |
    ConflictDialog.tsx — 简单的冲突检测对话框，仅有"重新加载"和"取消"按钮
    config store 的 saveConfig() 在 baseHash 不匹配时设置 conflict: true
    无字段级差异展示，无合并选择
  config_store: |
    config.ts 关键状态：schema, uiHints, rawConfig, editedConfig, baseHash, isDirty, conflict
    fetchSchema() → config.schema API → stores schema + uiHints
    fetchConfig() → config.read API → stores rawConfig + editedConfig + baseHash
    saveConfig() → config.patch API (with editedConfig diff + baseHash)
    reloadConfig() → re-fetch config, overwrite editedConfig
  i18n_namespace: "config（已有 ~40 key），需新增搜索语法提示、标签名称、冲突解决文案"
